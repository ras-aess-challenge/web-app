services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      WS_PORT: 4311
    ports: ["4311:4311"]
    depends_on: [mosquitto]
  dashboard:
    build: { context: ., dockerfile: dashboard/Dockerfile }
    environment:
      VITE_WS_URL: ws://localhost:4311
    ports: ["5173:5173"]
    depends_on: [backend]
